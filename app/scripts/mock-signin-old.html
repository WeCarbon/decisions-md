<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; font: 13px Georgia, serif; background: #e9e9e9; height: 100vh; display: grid; place-items: center; color: #222; }
  .box { width: 320px; background: #fff; border: 1px solid #bbb; padding: 18px 20px; }
  h1 { font-size: 17px; margin: 0 0 14px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
  label { display: block; margin: 10px 0 4px; }
  .in { height: 24px; border: 1px solid #999; }
  .btn { margin-top: 14px; display: inline-block; padding: 4px 14px; border: 1px solid #777; background: linear-gradient(#fafafa, #ddd); }
  .alt { margin-top: 12px; font-size: 12px; color: #00c; text-decoration: underline; }
</style>
</head>
<body>
  <div class="box">
    <h1>Acme — Log in</h1>
    <label>Username</label>
    <div class="in"></div>
    <label>Password</label>
    <div class="in"></div>
    <div class="btn">Log in</div>
    <div class="alt">Forgot your password?</div>
  </div>
</body>
</html>
