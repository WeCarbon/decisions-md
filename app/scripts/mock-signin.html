<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; font: 14px -apple-system, sans-serif; background: linear-gradient(160deg, #eef1ff, #f8f9fb); height: 100vh; display: grid; place-items: center; color: #1c1c1f; }
  .card { width: 340px; background: white; border-radius: 16px; padding: 30px 30px 26px; box-shadow: 0 20px 50px rgba(30, 40, 90, 0.12); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; margin-bottom: 22px; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #7c8cff, #5e6ad2); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #6b6d78; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: #6b6d78; margin: 12px 0 6px; }
  .in { height: 38px; border-radius: 9px; border: 1px solid #e3e4ea; padding: 0 12px; display: flex; align-items: center; color: #9a9ba3; }
  .btn { margin-top: 20px; height: 40px; border-radius: 10px; background: #5e6ad2; color: white; display: grid; place-items: center; font-weight: 600; }
  .alt { margin-top: 14px; text-align: center; font-size: 12px; color: #9a9ba3; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><i></i>Acme</div>
    <h1>Welcome back</h1>
    <p>Sign in to continue to your workspace.</p>
    <label>Email</label>
    <div class="in">alice@example.com</div>
    <label>Password</label>
    <div class="in">••••••••••</div>
    <div class="btn">Sign in</div>
    <div class="alt">Use a passkey instead</div>
  </div>
</body>
</html>
